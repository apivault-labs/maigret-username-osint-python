[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-maigret-username-osint"
version = "0.1.0"
description = "Python client for Username Search on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "maigret", "username", "osint"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/maigret-username-osint"
Source = "https://github.com/apivault-labs/maigret-username-osint-python"
Documentation = "https://github.com/apivault-labs/maigret-username-osint-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_maigret_username_osint*"]
